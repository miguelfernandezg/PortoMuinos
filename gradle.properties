# Configuración general de Gradle y AndroidX para el proyecto.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# El proyecto utiliza exclusivamente dependencias AndroidX.
android.useAndroidX=true

# Mantiene el estilo oficial de Kotlin en el código generado y formateado por el IDE.
kotlin.code.style=official

# Limita cada clase R a los recursos declarados por su propio módulo.
android.nonTransitiveRClass=true
